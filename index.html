<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Питон в браузере | Онлайн-компилятор Python для уроков</title>
    <meta name="description" content="Удобный онлайн-компилятор Python прямо в браузере. Создан для уроков информатики. Поддержка ввода данных, умные подсказки, смена тем оформления.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/matchbrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/python-hint.min.js"></script>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>

    <style>
        /* --- ПРОФЕССИОНАЛЬНЫЕ ЦВЕТОВЫЕ СХЕМЫ --- */
        
        /* Тёмная тема (Tokyo Night) */
        :root {
            --bg-body: #1a1b26;
            --bg-surface: #16161e;
            --bg-surface-hover: #292e42;
            --bg-editor: #1a1b26;
            --text-primary: #c0caf5;
            --text-secondary: #565f89;
            --accent: #7aa2f7;
            --accent-hover: #2ac3de;
            --border: #292e42;
            --success: #9ece6a;
            --error: #f7768e;
            --console-bg: #16161e;
        }

        /* Светлая тема (GitHub Light) */
        [data-theme="light"] {
            --bg-body: #f6f8fa;
            --bg-surface: #ffffff;
            --bg-surface-hover: #eaeef2;
            --bg-editor: #ffffff;
            --text-primary: #1f2328;
            --text-secondary: #656d76;
            --accent: #0969da;
            --accent-hover: #0550ae;
            --border: #d0d7de;
            --success: #1a7f37;
            --error: #cf222e;
            --console-bg: #f6f8fa;
        }

        /* Неоновая тема (Cyberpunk / Synthwave) */
        [data-theme="neon"] {
            --bg-body: #0d0b14;
            --bg-surface: #16111f;
            --bg-surface-hover: #241b33;
            --bg-editor: #0d0b14;
            --text-primary: #e0def4;
            --text-secondary: #6e6a86;
            --accent: #ff007f;
            --accent-hover: #ff3399;
            --border: #2a1b3d;
            --success: #00f0ff;
            --error: #ff007f;
            --console-bg: #090710;
        }

        /* --- БАЗОВЫЕ СТИЛИ --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-body); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

        /* --- HEADER --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            height: 50px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 16px;
        }
        .logo i { color: var(--accent); font-size: 20px; }

        .controls { display: flex; gap: 12px; align-items: center; }

        button, select {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-surface-hover);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            outline: none;
        }

        button:hover, select:hover {
            border-color: var(--accent);
            background: var(--bg-surface);
        }

        button.run-btn {
            background: var(--accent);
            color: #fff;
            border: none;
        }
        button.run-btn:hover { background: var(--accent-hover); }

        /* --- РАБОЧАЯ ОБЛАСТЬ --- */
        main {
            display: flex;
            flex: 1;
            height: calc(100vh - 75px);
        }

        .panel {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
        }

        .panel-left { border-right: 1px solid var(--border); }

        .panel-header {
            display: flex;
            align-items: center;
            height: 40px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            padding: 0 15px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .tab {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-editor);
            color: var(--text-primary);
            padding: 0 15px;
            height: 100%;
            border-right: 1px solid var(--border);
            border-top: 2px solid var(--accent);
            font-family: 'Fira Code', monospace;
            font-size: 13px;
        }

        /* Переопределяем фон CodeMirror под наши темы */
        .CodeMirror {
            height: 100% !important;
            font-family: 'Fira Code', monospace;
            font-size: 15px;
            line-height: 1.6;
            background: var(--bg-editor) !important;
        }
        
        .cm-s-dracula .CodeMirror-gutters {
            background: var(--bg-editor) !important;
            border-right: 1px solid var(--border) !important;
        }

        /* --- СТИЛИЗАЦИЯ ПОДСКАЗОК --- */
        .CodeMirror-hints {
            background: var(--bg-surface) !important;
            border: 1px solid var(--border) !important;
            border-radius: 6px !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3) !important;
            font-family: 'Fira Code', monospace !important;
            font-size: 14px !important;
            padding: 4px 0 !important;
            z-index: 1000 !important;
        }
        .CodeMirror-hint {
            color: var(--text-primary) !important;
            padding: 6px 12px !important;
            cursor: pointer !important;
        }
        li.CodeMirror-hint-active {
            background: var(--accent) !important;
            color: #fff !important;
        }

        /* --- КОНСОЛЬ --- */
        .console-wrapper {
            flex: 1;
            background: var(--console-bg);
            display: flex;
            flex-direction: column;
        }

        .console-topbar {
            display: flex;
            gap: 6px;
            padding: 10px 15px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot.red { background: #ff5f56; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #27c93f; }

        #output {
            flex: 1;
            padding: 20px;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            color: var(--text-primary);
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .output-success { color: var(--success); font-weight: 500; }
        .output-error { color: var(--error); font-weight: 500; }

        /* --- FOOTER --- */
        footer {
            height: 25px;
            background: var(--bg-surface);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            font-size: 12px;
            color: var(--text-secondary);
            z-index: 10;
        }

        .status-left, .status-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        #py-status.loading { color: #f59e0b; }
        #py-status.ready { color: var(--success); }

        @media (max-width: 768px) {
            main { flex-direction: column; }
            .panel-left { border-right: none; border-bottom: 1px solid var(--border); }
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <div class="logo">
            <i class="ph ph-terminal-window"></i>
            Питон в браузере
        </div>
        <div class="controls">
            <select id="theme-select" onchange="changeTheme(this.value)">
                <option value="dark">Тёмная</option>
                <option value="light">Светлая</option>
                <option value="neon">Неон</option>
            </select>
            <button onclick="clearOutput()">
                <i class="ph ph-trash"></i> Очистить
            </button>
            <button class="run-btn" onclick="runPython()">
                <i class="ph-fill ph-play"></i> Запустить (Ctrl+Enter)
            </button>
        </div>
    </header>

    <main>
        <div class="panel panel-left">
            <div class="panel-header">
                <div class="tab">
                    <i class="ph ph-file-py"></i> main.py
                </div>
            </div>
            <textarea id="code-editor">
# Добро пожаловать! Пиши код здесь.
# Нажми Ctrl+Enter для запуска.
# Подсказки: начни писать и нажми Ctrl+Space.

def greet(name):
    print(f"Привет, {name}!")

user_name = input("Введи свое имя: ")
greet(user_name)
            </textarea>
        </div>

        <div class="panel">
            <div class="panel-header">
                <i class="ph ph-terminal" style="margin-right: 8px;"></i> Терминал
            </div>
            <div class="console-wrapper">
                <div class="console-topbar">
                    <div class="dot red"></div>
                    <div class="dot yellow"></div>
                    <div class="dot green"></div>
                </div>
                <pre id="output">Ожидание запуска кода...</pre>
            </div>
        </div>
    </main>

    <footer>
        <div class="status-left">
            <span class="status-item" id="py-status">
                <i class="ph ph-spinner-gap ph-spin"></i> Загрузка Python...
            </span>
        </div>
        <div class="status-right">
            <span class="status-item" id="cursor-position">Стр 1, Стлб 1</span>
            <span class="status-item">UTF-8</span>
            <span class="status-item">Python 3</span>
            <span class="status-item" style="opacity: 0.7;">© 2024 Твое Имя</span>
        </div>
    </footer>

    <script>
        let editor;
        let pyodideReady = false;
        let pyodide;

        window.onload = function() {
            editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
                mode: "python",
                theme: "dracula", // Базовый синтаксис берем из Dracula, фон переопределен в CSS
                lineNumbers: true,
                autoCloseBrackets: true,
                matchBrackets: true,
                indentUnit: 4,
                lineWrapping: true,
                extraKeys: {
                    "Ctrl-Space": "autocomplete",
                    "Ctrl-Enter": function() { runPython(); },
                    "Cmd-Enter": function() { runPython(); },
                    "Tab": function(cm) {
                        if (cm.state.completionActive) {
                            cm.state.completionActive.widget.selectActive();
                        } else {
                            cm.replaceSelection("    ", "end");
                        }
                    }
                }
            });

            let timeout;
            editor.on("inputRead", function(cm, change) {
                if (change.text[0].match(/[a-zA-Z_]/)) {
                    clearTimeout(timeout);
                    timeout = setTimeout(() => {
                        cm.showHint({ hint: CodeMirror.pythonHint, completeSingle: false });
                    }, 300);
                }
            });

            editor.on("cursorActivity", function(cm) {
                let pos = cm.getCursor();
                document.getElementById("cursor-position").innerText = `Стр ${pos.line + 1}, Стлб ${pos.ch + 1}`;
            });

            initPyodide();
        };

        function changeTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            
            // Для светлой темы используем дефолтную светлую тему редактора
            if (theme === 'light') {
                editor.setOption("theme", "default");
            } else {
                // Для темной и неона используем Dracula (его цвета синтаксиса универсальны)
                editor.setOption("theme", "dracula");
            }
        }

        function clearOutput() {
            document.getElementById('output').innerText = "";
        }

        async function initPyodide() {
            try {
                pyodide = await loadPyodide({
                    stdout: (text) => {
                        document.getElementById('output').innerText += text + "\n";
                    },
                    stderr: (text) => {
                        let out = document.getElementById('output');
                        out.innerHTML += `<span class="output-error">${text}</span>\n`;
                    }
                });

                pyodide.runPython(`
import builtins
def custom_input(prompt=""):
    import js
    return js.prompt(prompt)
builtins.input = custom_input
                `);

                const status = document.getElementById('py-status');
                status.innerHTML = '<i class="ph-fill ph-check-circle"></i> Python готов';
                status.className = "status-item ready";
                pyodideReady = true;
            } catch (error) {
                console.error("Ошибка Pyodide:", error);
                document.getElementById('py-status').innerHTML = '<i class="ph-fill ph-x-circle"></i> Ошибка загрузки';
            }
        }

        async function runPython() {
            if (!pyodideReady) {
                alert("Подожди, Python загружается...");
                return;
            }

            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML = "";
            
            const code = editor.getValue();

            try {
                await pyodide.runPythonAsync(code);
                outputDiv.innerHTML += '\n\n<span class="output-success">[Успешно завершено]</span>';
            } catch (error) {
                outputDiv.innerHTML += `\n\n<span class="output-error">[Ошибка выполнения]:\n${error.message}</span>`;
            }
        }
    </script>
</body>
</html>
