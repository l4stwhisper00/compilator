<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>Питон в браузере | Онлайн-компилятор Python</title>

    <script>
        // Применяем тему до отрисовки, чтобы не было "вспышки"
        (function () {
            try {
                var t = localStorage.getItem('python_ide_theme');
                if (t === 'dark' || t === 'light' || t === 'neon') {
                    document.documentElement.setAttribute('data-theme', t);
                }
            } catch (e) { /* localStorage недоступен */ }
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" crossorigin="anonymous">

    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/dialog/dialog.min.css" crossorigin="anonymous">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/matchbrackets.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/search/searchcursor.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/search/search.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/dialog/dialog.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/comment/comment.min.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-body: #0b0b0e;
            --glow-bg: radial-gradient(circle at 50% 50%, #1e1e24 0%, #0b0b0e 70%);
            --bg-panel: rgba(22, 22, 28, 0.75);
            --bg-surface: #18181f;
            --bg-surface-hover: #272732;
            --text-primary: #a9b7c6;
            --text-secondary: #767e8c;
            --accent: #ff9d5c;
            --accent-hover: #ffb07a;
            --accent-glow: rgba(255, 157, 92, 0.35);
            --on-accent: #111;
            --border: rgba(255, 255, 255, 0.08);
            --console-bg: rgba(15, 15, 18, 0.85);
            --success: #6a8759;
            --error: #ff5252;

            --syn-keyword: #ff9d5c;
            --syn-string: #98c379;
            --syn-number: #61afef;
            --syn-comment: #808080;
            --syn-def: #e5c07b;
            --syn-builtin: #ff9d5c;
            --syn-variable: #a9b7c6;
            --syn-property: #56b6c2;

            --editor-font-size: 15px;
        }

        [data-theme="light"] {
            --bg-body: #f2f4f8; 
            --glow-bg: radial-gradient(circle at 50% 50%, #ffffff 0%, #e2e8f0 100%);
            --bg-panel: rgba(255, 255, 255, 0.8); 
            --bg-surface: #ffffff; 
            --bg-surface-hover: #f1f3f5;
            --text-primary: #1f1f1f; 
            --text-secondary: #5f6670; 
            --accent: #005cbf; 
            --accent-hover: #004494;
            --accent-glow: rgba(0, 92, 191, 0.3); 
            --on-accent: #fff;
            --border: rgba(0, 0, 0, 0.1); 
            --console-bg: rgba(248, 250, 252, 0.9); 
            --success: #008000; 
            --error: #c00000;
            --syn-keyword: #0033b3; 
            --syn-string: #067d17; 
            --syn-number: #1750eb; 
            --syn-comment: #8c8c8c;
            --syn-def: #00627a; 
            --syn-builtin: #0033b3; 
            --syn-variable: #1f1f1f; 
            --syn-property: #008080;
        }
        
        [data-theme="neon"] {
            --bg-body: #05000a; 
            --glow-bg: radial-gradient(circle at 50% 50%, #1c0633 0%, #05000a 70%);
            --bg-panel: rgba(20, 10, 30, 0.7); 
            --bg-surface: #120a1c; 
            --bg-surface-hover: #26133b;
            --text-primary: #e0def4; 
            --text-secondary: #8b7ca4; 
            --accent: #ff007f; 
            --accent-hover: #ff3399;
            --accent-glow: rgba(255, 0, 127, 0.4); 
            --on-accent: #fff;
            --border: rgba(255, 0, 127, 0.2); 
            --console-bg: rgba(10, 5, 15, 0.9); 
            --success: #00f0ff; 
            --error: #ff4d6d;
            --syn-keyword: #ff007f; 
            --syn-string: #00f0ff; 
            --syn-number: #f1fa8c; 
            --syn-comment: #6272a4;
            --syn-def: #bd93f9; 
            --syn-builtin: #ff007f; 
            --syn-variable: #e0def4; 
            --syn-property: #8be9fd;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        [hidden] { display: none !important; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-body); 
            background-image: var(--glow-bg);
            color: var(--text-primary);
            height: 100vh; 
            height: 100dvh;
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
            transition: background 0.4s;
        }
        
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .spin { display: inline-block; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---- Загрузка ---- */
        #loading-overlay { 
            position: fixed; inset: 0; 
            background: var(--bg-body); 
            z-index: 9999; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 15px; 
            transition: opacity 0.5s ease-out, visibility 0.5s; 
        }
        #loading-overlay.hidden { opacity: 0; visibility: hidden; }
        .loading-text { font-size: 20px; font-weight: 600; letter-spacing: 1px; }
        .loading-subtext { font-size: 13px; color: var(--text-secondary); text-align: center; max-width: 360px; }
        .progress-container { width: 300px; max-width: 80vw; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent-hover)); border-radius: 4px; transition: width 0.2s ease; box-shadow: 0 0 10px var(--accent); }
        .progress-bar.failed { background: var(--error); box-shadow: none; }

        /* ---- Шапка ---- */
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 0 20px; min-height: 56px; 
            background: var(--bg-panel); 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); 
            border-bottom: 1px solid var(--border); 
            z-index: 10; flex-shrink: 0; 
        }
        .logo { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; }
        .logo i { color: var(--accent); font-size: 22px; }
        .logo-text {
            background: linear-gradient(90deg, var(--text-primary) 0%, var(--accent) 50%, var(--text-primary) 100%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: logoShine 5s ease-in-out infinite;
        }
        @keyframes logoShine {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .controls { display: flex; gap: 12px; align-items: center; }
        button, select { 
            display: flex; align-items: center; gap: 6px; 
            background: var(--bg-surface); color: var(--text-primary); 
            border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; 
            font-family: inherit; font-size: 13px; font-weight: 500; 
            cursor: pointer; 
            transition: background 0.2s, border-color 0.2s, color 0.2s, box-shadow 0.2s; 
        }
        button:hover:not(:disabled), select:hover { border-color: var(--accent); background: var(--bg-surface-hover); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .icon-btn { padding: 8px; }
        button.run-btn { background: var(--accent); color: var(--on-accent); border: none; box-shadow: 0 0 10px var(--accent-glow); font-weight: 600; padding: 8px 16px; }
        button.run-btn:hover:not(:disabled) { background: var(--accent-hover); box-shadow: 0 0 15px var(--accent-glow); }
        button.stop-btn { background: var(--error); color: #fff; border: none; box-shadow: 0 0 10px rgba(255, 82, 82, 0.3); font-weight: 600; padding: 8px 16px; }
        button.stop-btn:hover { background: #d32f2f; box-shadow: 0 0 15px rgba(255, 82, 82, 0.5); }

        /* Ripple */
        .has-ripple { position: relative; overflow: hidden; isolation: isolate; }
        .has-ripple::before {
            content: '';
            position: absolute;
            left: calc(var(--ripple-left, 50%) - var(--ripple-size, 100px) / 2);
            top: calc(var(--ripple-top, 50%) - var(--ripple-size, 100px) / 2);
            width: var(--ripple-size, 100px);
            height: var(--ripple-size, 100px);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            pointer-events: none;
            transform: scale(0);
            opacity: 0;
            z-index: 0;
        }
        .has-ripple.rippling::before { animation: rippleAnim 0.65s ease-out; }
        @keyframes rippleAnim {
            0% { transform: scale(0); opacity: 0.55; }
            100% { transform: scale(1); opacity: 0; }
        }

        .font-size-control { 
            display: flex; align-items: center; gap: 8px; 
            background: var(--bg-surface); border: 1px solid var(--border); 
            padding: 0 12px; border-radius: 8px; height: 35px; 
        }
        .font-size-control output { font-size: 13px; font-weight: 600; color: var(--text-secondary); min-width: 35px; text-align: center; }
        
        input[type=range] { -webkit-appearance: none; appearance: none; width: 80px; background: transparent; cursor: pointer; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%; background: var(--accent); margin-top: -5px; box-shadow: 0 0 5px var(--accent); }
        input[type=range]::-webkit-slider-runnable-track { height: 4px; background: var(--border); border-radius: 2px; }
        input[type=range]::-moz-range-thumb { height: 14px; width: 14px; border: none; border-radius: 50%; background: var(--accent); }
        input[type=range]::-moz-range-track { height: 4px; background: var(--border); border-radius: 2px; }

        /* ---- Основная область ---- */
        main { display: flex; flex: 1; min-height: 0; padding: 16px; gap: 16px; }
        
        .panel { 
            display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; 
            background: var(--bg-panel); 
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); 
            border-radius: 12px; border: 1px solid var(--border); 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); 
            overflow: hidden; 
        }
        .panel-header { 
            display: flex; justify-content: space-between; align-items: center; 
            height: 42px; flex-shrink: 0; 
            background: var(--bg-surface); 
            border-bottom: 1px solid var(--border); 
            padding: 0 15px; font-size: 13px; color: var(--text-secondary); 
        }
        .panel-header-left { display: flex; align-items: center; gap: 8px; }

        /* ---- Вкладки ---- */
        .tabs-header {
            display: flex; justify-content: flex-start; align-items: stretch;
            padding: 0; height: 42px; flex-shrink: 0;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            overflow: hidden;
        }
        .tabs-scroll {
            display: flex; flex: 1;
            overflow-x: auto; overflow-y: hidden;
            scrollbar-width: thin;
        }
        .tabs-scroll::-webkit-scrollbar { height: 3px; }
        .tabs-scroll::-webkit-scrollbar-thumb { background: var(--border); }
        
        .editor-tab {
            display: flex; align-items: center; gap: 6px;
            padding: 0 10px 0 12px; height: 42px;
            background: var(--bg-surface);
            color: var(--text-secondary);
            border-right: 1px solid var(--border);
            border-top: 2px solid transparent;
            font-family: 'Fira Code', monospace; font-size: 13px;
            cursor: pointer; white-space: nowrap;
            flex-shrink: 0;
            transition: background 0.15s, color 0.15s;
        }
        .editor-tab:hover { background: var(--bg-surface-hover); color: var(--text-primary); }
        .editor-tab.active {
            background: var(--console-bg);
            color: var(--text-primary);
            border-top-color: var(--accent);
        }
        .editor-tab i { color: var(--accent); font-size: 14px; flex-shrink: 0; }
        
        .tab-name { padding: 2px 0; outline: none; border-radius: 3px; max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
        .tab-name[contenteditable="true"] {
            background: var(--bg-body);
            padding: 2px 6px;
            outline: 1px solid var(--accent);
            max-width: none;
            text-overflow: clip;
        }
        
        .tab-close {
            background: transparent; border: none; padding: 2px;
            border-radius: 3px; color: var(--text-secondary);
            font-size: 12px; opacity: 0;
            transition: opacity 0.15s, color 0.15s, background 0.15s;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; flex-shrink: 0;
        }
        .editor-tab:hover .tab-close,
        .editor-tab.active .tab-close { opacity: 1; }
        .tab-close:hover { background: var(--error); color: #fff; border-color: transparent; }
        
        .tab-add-btn {
            background: transparent; border: none; border-left: 1px solid var(--border);
            color: var(--text-secondary); padding: 0 14px; height: 42px;
            border-radius: 0; cursor: pointer; flex-shrink: 0;
        }
        .tab-add-btn:hover { color: var(--accent); background: var(--bg-surface-hover); border-color: var(--border); }

        /* ---- Редактор ---- */
        .editor-container { flex: 1; position: relative; overflow: hidden; }
        .editor-container::after {
            content: '';
            position: absolute; inset: 0;
            pointer-events: none;
            border-radius: inherit;
            box-shadow: inset 0 0 50px var(--accent-glow);
            opacity: 0;
            transition: opacity 0.4s;
            z-index: 5;
        }
        .editor-container.typing::after { opacity: 1; }
        
        @keyframes fadeIn {
            from { opacity: 0.4; }
            to { opacity: 1; }
        }
        .editor-container.fade-in .CodeMirror { animation: fadeIn 0.25s ease-out; }

        .CodeMirror { 
            position: absolute; inset: 0; 
            height: 100% !important; 
            font-family: 'Fira Code', monospace; 
            font-size: var(--editor-font-size) !important; 
            line-height: 1.6; 
            background: transparent !important; 
        }
        .CodeMirror-lines { padding-bottom: 70px; }
        .CodeMirror-gutters { background: transparent !important; border-right: 1px solid var(--border) !important; }
        .CodeMirror-linenumber { color: var(--text-secondary) !important; }
        .CodeMirror-selected { background: var(--accent-glow) !important; }
        
        .cm-s-custom .CodeMirror-cursor { border-left: 2px solid var(--accent) !important; }
        .cm-s-custom.CodeMirror { color: var(--syn-variable); }
        .cm-s-custom .cm-keyword { color: var(--syn-keyword); font-weight: bold; }
        .cm-s-custom .cm-operator { color: var(--syn-variable); }
        .cm-s-custom .cm-string { color: var(--syn-string); }
        .cm-s-custom .cm-number { color: var(--syn-number); }
        .cm-s-custom .cm-comment { color: var(--syn-comment); font-style: italic; }
        .cm-s-custom .cm-def { color: var(--syn-def); }
        .cm-s-custom .cm-builtin { color: var(--syn-builtin); }
        .cm-s-custom .cm-variable, .cm-s-custom .cm-variable-2 { color: var(--syn-variable); }
        .cm-s-custom .cm-property { color: var(--syn-property) !important; font-style: italic; }
        .cm-s-custom .cm-variable-3 { color: var(--syn-property) !important; }
        .cm-s-custom .CodeMirror-matchingbracket { color: var(--accent) !important; text-decoration: underline; }
        
        .CodeMirror-dialog { background: var(--bg-surface) !important; color: var(--text-primary) !important; border-bottom: 1px solid var(--border) !important; padding: 8px 15px !important; font-family: 'Inter', sans-serif !important; font-size: 14px !important; }
        .CodeMirror-dialog input { background: var(--bg-body) !important; color: var(--text-primary) !important; border: 1px solid var(--border) !important; border-radius: 4px; padding: 4px 8px; }
        
        .CodeMirror-hints { background: var(--bg-surface) !important; border: 1px solid var(--border) !important; border-radius: 10px !important; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5) !important; font-family: 'Fira Code', monospace !important; font-size: var(--editor-font-size) !important; padding: 6px 0 !important; z-index: 1000 !important; }
        .CodeMirror-hint { color: var(--text-primary) !important; padding: 6px 16px !important; cursor: pointer !important; }
        li.CodeMirror-hint-active { background: transparent !important; color: var(--accent) !important; font-weight: 600; text-shadow: 0 0 6px var(--accent-glow) !important; }

        /* ---- Терминал ---- */
        .console-wrapper { flex: 1; background: var(--console-bg); display: flex; flex-direction: column; min-height: 0; }
        .console-topbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 18px; border-bottom: 1px solid var(--border); }
        .dots { display: flex; gap: 8px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot.red { background: #ff5f56; } 
        .dot.yellow { background: #ffbd2e; } 
        .dot.green { background: #27c93f; }
        .copy-btn { background: transparent; border: none; color: var(--text-secondary); font-size: 16px; padding: 4px; }
        .copy-btn:hover:not(:disabled) { color: var(--accent); background: transparent; }
        
        #output { 
            flex: 1; padding: 20px 20px 40px; 
            font-family: 'Fira Code', monospace; font-size: 14px; 
            overflow-y: auto; white-space: pre-wrap; word-break: break-word; 
            line-height: 1.6; min-height: 0; cursor: text; 
        }
        .output-success { color: var(--success); font-weight: 500; }
        .output-error { color: var(--error); }
        .output-info { color: var(--text-secondary); }
        .output-input { color: var(--accent); }

        /* ---- Подвал ---- */
        footer { 
            height: 30px; flex-shrink: 0; 
            background: var(--bg-panel); 
            border-top: 1px solid var(--border); 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 0 20px; font-size: 12px; color: var(--text-secondary); 
            z-index: 10; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); 
        }
        .status-left, .status-right { display: flex; gap: 15px; align-items: center; }
        .status-item { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
        #py-status.loading, #py-status.running { color: var(--accent); }
        #py-status.ready { color: var(--success); }
        #py-status.error { color: var(--error); }

        /* ---- Заметка ---- */
        .note-widget {
            position: fixed;
            bottom: 45px;
            right: 16px;
            width: 340px;
            max-width: calc(100vw - 32px);
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            z-index: 900;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            animation: noteIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        @keyframes noteIn {
            from { opacity: 0; transform: translateY(15px) scale(0.94); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .note-widget.pinned {
            border-color: var(--accent);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 0 0 24px var(--accent-glow);
        }
        .note-header {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 12px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            font-size: 13px; font-weight: 600;
        }
        .note-header > i { color: var(--accent); }
        .note-header > span { flex: 1; }
        .note-header-actions { display: flex; gap: 4px; }
        .note-action {
            background: transparent; border: none;
            color: var(--text-secondary);
            padding: 4px; border-radius: 4px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: color 0.2s, background 0.2s;
        }
        .note-action:hover:not(:disabled) { color: var(--accent); background: var(--bg-surface-hover); border-color: transparent; }
        .note-action.active { color: var(--accent); }
        .note-action:disabled { opacity: 0.3; cursor: not-allowed; }
        
        #note-text {
            background: var(--bg-body);
            border: none;
            padding: 12px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            line-height: 1.55;
            resize: vertical;
            min-height: 140px;
            max-height: 340px;
            outline: none;
        }
        #note-text::placeholder { color: var(--text-secondary); opacity: 0.7; }

        @media (max-width: 900px) {
            header { flex-direction: column; padding: 10px; gap: 10px; }

    <!-- Код Web Worker (Replay Execution Mode) -->
    <script type="text/plain" id="py-worker-src">
'use strict';

let pyodide = null;
let runner = null;
let maxOutput = Infinity;
let sent = 0;
let outBuf = '';
let outKind = 'stdout';
let lastFlush = 0;
let currentCode = '';
let currentInputs = [];

const RUNNER_SRC = [
    'import sys, traceback, builtins',
    'def _ide_run(src):',
    '    def custom_input(prompt=""):',
    '        if prompt:',
    '            sys.stdout.write(str(prompt))',
    '            sys.stdout.flush()',
    '        import js',
    '        val = js.get_ide_input(prompt)',
    '        if val is None or val == "\\x00EOF\\x00":',
    '            print()',
    '            raise EOFError()',
    '        print(val)',
    '        return val',
    '',
    '    builtins.input = custom_input',
    '',
    '    ns = {"__name__": "__main__"}',
    '    rc = 0',
    '    try:',
    '        exec(compile(src, "main.py", "exec"), ns)',
    '    except SystemExit as e:',
    '        if e.code is None:',
    '            rc = 0',
    '        elif isinstance(e.code, int):',
    '            rc = e.code',
    '        else:',
    '            print(e.code, file=sys.stderr)',
    '            rc = 1',
    '    except KeyboardInterrupt:',
    '        print("\\nKeyboardInterrupt", file=sys.stderr)',
    '        rc = 130',
    '    except BaseException as e:',
    '        if "__IDE_NEED_INPUT__" in str(e):',
    '            raise',
    '        tb = e.__traceback__',
    '        while tb is not None and tb.tb_frame.f_code.co_filename != "main.py":',
    '            tb = tb.tb_next',
    '        traceback.print_exception(type(e), e, tb)',
    '        rc = 1',
    '    finally:',
    '        try:',
    '            sys.stdout.flush()',
    '            sys.stderr.flush()',
    '        except Exception:',
    '            pass',
    '    return rc',
].join('\n');

function flush() {
    if (outBuf) {
        postMessage({ type: 'out', kind: outKind, text: outBuf });
        outBuf = '';
    }
    lastFlush = Date.now();
}

function emit(kind, text) {
    if (!text || sent >= maxOutput) return;
    if (kind !== outKind) { flush(); outKind = kind; }
    outBuf += text;
    sent += text.length;
    if (outBuf.length >= 8192 || Date.now() - lastFlush >= 50) flush();
}

function makeWriter(kind) {
    const decoder = new TextDecoder('utf-8');
    return {
        write(bytes) {
            emit(kind, decoder.decode(bytes, { stream: true }));
            return bytes.length;
        }
    };
}

async function init(msg) {
    maxOutput = msg.maxOutput || Infinity;
    importScripts(msg.indexURL + 'pyodide.js');
    pyodide = await loadPyodide({ indexURL: msg.indexURL });
    
    pyodide.setStdout(makeWriter('stdout'));
    pyodide.setStderr(makeWriter('stderr'));
    
    // Функция моста для input
    pyodide.globals.set("get_ide_input", (prompt) => {
        if (currentInputs.length > 0) {
            return currentInputs.shift();
        }
        throw new Error("__IDE_NEED_INPUT__:" + (prompt || ""));
    });

    pyodide.runPython(RUNNER_SRC);
    runner = pyodide.globals.get('_ide_run');
    postMessage({ type: 'ready', version: pyodide.version });
}

async function run(msg) {
    currentCode = msg.code;
    if (msg.inputs) {
        currentInputs = [...msg.inputs];
    } else {
        currentInputs = [];
    }

    sent = 0;
    outBuf = '';
    outKind = 'stdout';
    lastFlush = Date.now();

    if (!msg.isReplay) {
        try {
            await pyodide.loadPackagesFromImports(currentCode, {
                messageCallback: (t) => postMessage({ type: 'info', text: t }),
                errorCallback: (t) => postMessage({ type: 'info', text: t }),
            });
        } catch (e) {
            postMessage({ type: 'info', text: 'Не удалось загрузить пакеты: ' + ((e && e.message) || e) });
        }
        postMessage({ type: 'started' });
    } else {
        postMessage({ type: 'started' });
    }

    try {
        let rc = runner(currentCode);
        flush();
        postMessage({ type: 'done', code: typeof rc === 'number' ? rc : 1 });
    } catch (e) {
        if (e.message && e.message.includes("__IDE_NEED_INPUT__")) {
            let pText = e.message.split("__IDE_NEED_INPUT__:")[1];
            postMessage({ type: 'need_input', prompt: pText });
        } else {
            flush();
            postMessage({ type: 'run_error', text: String((e && e.message) || e) });
        }
    }
}

self.onmessage = (e) => {
    const msg = e.data;
    if (msg.type === 'init') {
        init(msg).catch(err => postMessage({ type: 'init_error', text: String((err && err.message) || err) }));
    } else if (msg.type === 'run') {
        run(msg).catch(err => postMessage({ type: 'run_error', text: String((err && err.message) || err) }));
    }
};
    </script>

    <script>
    (() => {
        'use strict';

        // ---- Конфигурация ----
        const CONFIG = {
            PYODIDE_URL: 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/',
            TIMEOUT_MS: 10000,          // Жёсткий лимит на выполнение без ввода
            INIT_SLOW_MS: 25000,        // Через сколько показать "Загрузка идёт дольше обычного"
            MAX_OUTPUT_CHARS: 200000,   // Лимит вывода в консоль
            MAX_FILE_BYTES: 1024 * 1024 // Лимит загружаемого файла (1 МБ)
        };

        const THEMES = ['dark', 'light', 'neon'];
        const KEYS = {
            tabs: 'python_ide_tabs',
            legacyCode: 'python_ide_code',
            theme: 'python_ide_theme',
            font: 'python_ide_font_size',
            note: 'python_ide_note',
            notePinned: 'python_ide_note_pinned',
            noteOpen: 'python_ide_note_open',
        };

        const DEFAULT_CODE = [
            '# Попробуй запустить бесконечный цикл:',
            '# while True:',
            '#     pass',
            '',
            'x = int(input("Введите целое число: "))',
            'y = int(input("Введите целое число: "))',
            'z = int(input("Введите целое число: "))',
            '',
            'if x == 0 or y == 0 or z == 0:',
            '    print(x + y + z)',
            'else:',
            '    print(x * y * z)',
            '',
        ].join('\n');

        const $ = (id) => document.getElementById(id);

        const store = {
            get(k) { try { return localStorage.getItem(k); } catch { return null; } },
            set(k, v) { try { localStorage.setItem(k, v); } catch { /* квота или приватный режим */ } },
        };

        function icon(cls) {
            const i = document.createElement('i');
            i.className = cls;
            i.setAttribute('aria-hidden', 'true');
            return i;
        }

        let editor = null;
        let syncingEditor = false;

        // ================= Вывод терминала =================

        const Out = {
            el: null, queue: [], chars: 0, truncated: false, raf: 0,

            clear() {
                this.queue = [];
                this.chars = 0;
                this.truncated = false;
                cancelAnimationFrame(this.raf);
                this.raf = 0;
                this.el.textContent = '';
            },

            write(text, cls = '', system = false) {
                if (!text) return;
                if (!system) {
                    if (this.truncated) return;
                    const left = CONFIG.MAX_OUTPUT_CHARS - this.chars;
                    if (text.length > left) {
                        text = text.slice(0, left);
                        this.truncated = true;
                    }
                    this.chars += text.length;
                }
                if (text) this.queue.push([text, cls]);
                if (!system && this.truncated) {
                    this.queue.push([`\n[Вывод обрезан: больше ${CONFIG.MAX_OUTPUT_CHARS.toLocaleString('ru-RU')} символов]\n`, 'output-info']);
                }
                if (!this.raf) this.raf = requestAnimationFrame(() => this.flush());
            },

            flush() {
                cancelAnimationFrame(this.raf);
                this.raf = 0;
                if (!this.queue.length) return;
                const el = this.el;
                const stick = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
                for (const [text, cls] of this.queue) {
                    const last = el.lastChild;
                    if (last && last.nodeName === 'SPAN' && last.className === cls && last.firstChild) {
                        last.firstChild.appendData(text);
                    } else {
                        const span = document.createElement('span');
                        if (cls) span.className = cls;
                        span.textContent = text;
                        el.appendChild(span);
                    }
                }
                this.queue = [];
                if (stick) el.scrollTop = el.scrollHeight;
            },

            text() {
                this.flush();
                return this.el.textContent;
            },
        };

        // ================= Ripple =================

        function attachRipple(el) {
            if (!el || el.dataset.rippleAttached) return;
            el.dataset.rippleAttached = '1';
            el.classList.add('has-ripple');
            el.addEventListener('pointerdown', (e) => {
                if (el.disabled) return;
                const rect = el.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height) * 2;
                el.style.setProperty('--ripple-left', (e.clientX - rect.left) + 'px');
                el.style.setProperty('--ripple-top', (e.clientY - rect.top) + 'px');
                el.style.setProperty('--ripple-size', size + 'px');
                el.classList.remove('rippling');
                void el.offsetWidth;
                el.classList.add('rippling');
                setTimeout(() => el.classList.remove('rippling'), 700);
            });
        }

        // ================= Вкладки =================

        const Tabs = {
            list: [], activeId: null, nextId: 1, saveTimer: 0,

            init() {
                let data = null;
                try {
                    const raw = localStorage.getItem(KEYS.tabs);
                    if (raw) data = JSON.parse(raw);
                } catch { /* некорректный JSON */ }

                if (data && Array.isArray(data.list) && data.list.length) {
                    this.list = data.list.map(t => ({
                        id: t.id,
                        name: t.name || 'main.py',
                        code: typeof t.code === 'string' ? t.code : '',
                        cursor: t.cursor || { line: 0, ch: 0 },
                        scroll: t.scroll || null,
                    }));
                    this.activeId = this.list.some(t => t.id === data.activeId) ? data.activeId : this.list[0].id;
                    this.nextId = data.nextId || (Math.max(...this.list.map(t => t.id)) + 1);
                } else {
                    let legacy = null;
                    try { legacy = localStorage.getItem(KEYS.legacyCode); } catch { /* ok */ }
                    this.list = [{
                        id: 1,
                        name: 'main.py',
                        code: legacy != null ? legacy : DEFAULT_CODE,
                        cursor: { line: 0, ch: 0 },
                        scroll: null,
                    }];
                    this.activeId = 1;
                    this.nextId = 2;
                }

                this.render();
                this.syncEditor();
            },

            get(id) { return this.list.find(t => t.id === id); },
            getActive() { return this.get(this.activeId); },

            save() {
                clearTimeout(this.saveTimer);
                this.saveTimer = setTimeout(() => this.saveNow(), 300);
            },
            saveNow() {
                clearTimeout(this.saveTimer);
                try {
                    localStorage.setItem(KEYS.tabs, JSON.stringify({
                        list: this.list,
                        activeId: this.activeId,
                        nextId: this.nextId,
                    }));
                } catch { /* квота */ }
            },

            setCode(code) {
                const t = this.getActive();
                if (t && t.code !== code) {
                    t.code = code;
                    this.save();
                }
            },

            saveCursor() {
                const t = this.getActive();
                if (t && editor) {
                    try {
                        t.cursor = editor.getCursor();
                        t.scroll = editor.getScrollInfo();
                    } catch { /* ok */ }
                }
            },

            syncEditor() {
                const t = this.getActive();
                if (!t || !editor) return;
                syncingEditor = true;
                editor.setValue(t.code || '');
                editor.clearHistory();
                syncingEditor = false;
                try {
                    if (t.cursor) editor.setCursor(t.cursor);
                    if (t.scroll) editor.scrollTo(t.scroll.left || 0, t.scroll.top || 0);
                } catch { /* ok */ }
                editor.focus();
            },

            activate(id) {
                if (this.activeId === id) return;
                this.saveCursor();
                this.activeId = id;
                this.syncEditor();
                this.save();
                this.render();
                const ec = $('editor-container');
                if (ec) {
                    ec.classList.remove('fade-in');
                    void ec.offsetWidth;
                    ec.classList.add('fade-in');
                }
            },

            add() {
                const id = this.nextId++;
                this.list.push({ id, name: `file${id}.py`, code: '', cursor: { line: 0, ch: 0 }, scroll: null });
                this.save();
                this.activate(id);
                this.render();
                const scroll = $('tabs-scroll');
                if (scroll) scroll.scrollLeft = scroll.scrollWidth;
            },

            close(id) {
                if (this.list.length <= 1) return;
                const idx = this.list.findIndex(t => t.id === id);
                if (idx === -1) return;
                const wasActive = this.activeId === id;
                this.list.splice(idx, 1);
                if (wasActive) {
                    const next = this.list[Math.min(idx, this.list.length - 1)];
                    this.activeId = next.id;
                    this.syncEditor();
                }
                this.save();
                this.render();
            },

            rename(id, newName) {
                const t = this.get(id);
                if (!t) return;
                newName = (newName || '').trim();
                if (!newName) { this.render(); return; }
                if (!/\.\w+$/.test(newName)) newName += '.py';
                t.name = newName;
                this.save();
                this.render();
            },

            render() {
                const scroll = $('tabs-scroll');
                if (!scroll) return;
                scroll.textContent = '';
                const showClose = this.list.length > 1;

                for (const t of this.list) {
                    const tab = document.createElement('div');
                    tab.className = 'editor-tab' + (t.id === this.activeId ? ' active' : '');
                    tab.dataset.id = t.id;

                    const ic = icon('ph ph-file-py');
                    const name = document.createElement('span');
                    name.className = 'tab-name';
                    name.textContent = t.name;
                    name.title = t.name + ' — двойной клик для переименования';

                    tab.appendChild(ic);
                    tab.appendChild(name);

                    if (showClose) {
                        const close = document.createElement('button');
                        close.type = 'button';
                        close.className = 'tab-close';
                        close.setAttribute('aria-label', 'Закрыть вкладку');
                        close.appendChild(icon('ph ph-x'));
                        close.addEventListener('click', (e) => {
                            e.stopPropagation();
                            this.close(t.id);
                        });
                        tab.appendChild(close);
                    }

                    tab.addEventListener('click', () => this.activate(t.id));

                    name.addEventListener('dblclick', (e) => {
                        e.stopPropagation();
                        name.contentEditable = 'true';
                        name.focus();
                        const r = document.createRange();
                        r.selectNodeContents(name);
                        const s = window.getSelection();
                        s.removeAllRanges();
                        s.addRange(r);
                    });
                    name.addEventListener('blur', () => {
                        if (name.contentEditable !== 'true') return;
                        name.contentEditable = 'false';
                        const newName = name.textContent.trim();
                        if (newName && newName !== t.name) {
                            this.rename(t.id, newName);
                        } else {
                            name.textContent = t.name;
                        }
                    });
                    name.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') { e.preventDefault(); name.blur(); }
                        else if (e.key === 'Escape') { name.textContent = t.name; name.blur(); }
                    });

                    scroll.appendChild(tab);
                }
            },
        };

        // ================= Заметка =================

        const Note = {
            el: null, textEl: null, pinned: false, open: false,

            init() {
                this.el = $('note-widget');
                this.textEl = $('note-text');

                this.textEl.value = store.get(KEYS.note) || '';
                this.pinned = store.get(KEYS.notePinned) === '1';

                if (this.pinned) this.applyPinned();
                if (store.get(KEYS.noteOpen) === '1' || this.pinned) this.show();

                this.textEl.addEventListener('input', () => {
                    store.set(KEYS.note, this.textEl.value);
                });

                $('note-pin-btn').addEventListener('click', () => this.togglePin());
                $('note-close-btn').addEventListener('click', () => {
                    if (this.pinned) return;
                    this.hide();
                });
                $('note-btn').addEventListener('click', () => this.toggle());
            },

            show() {
                this.el.hidden = false;
                this.open = true;
                store.set(KEYS.noteOpen, '1');
                setTimeout(() => this.textEl.focus(), 60);
            },

            hide() {
                this.el.hidden = true;
                this.open = false;
                store.set(KEYS.noteOpen, '0');
            },

            toggle() {
                if (this.open && this.pinned) {
                    this.pinned = false;
                    this.applyPinned();
                    this.hide();
                } else if (this.open) {
                    this.hide();
                } else {
                    this.show();
                }
            },

            togglePin() {
                this.pinned = !this.pinned;
                this.applyPinned();
                if (this.pinned) this.show();
            },

            applyPinned() {
                this.el.classList.toggle('pinned', this.pinned);
                $('note-pin-btn').classList.toggle('active', this.pinned);
                $('note-pin-btn').title = this.pinned ? 'Открепить' : 'Закрепить';
                $('note-close-btn').disabled = this.pinned;
                store.set(KEYS.notePinned, this.pinned ? '1' : '0');
            },
        };

        // ================= Python (Web Worker, Replay Input) =================

        const Py = {
            worker: null, url: null, ready: false, running: false,
            runTimer: 0, initTimer: 0, inputs: []
        };

        function setStatus(kind, text) {
            const el = $('py-status');
            const icons = {
                loading: 'ph ph-spinner-gap spin',
                ready: 'ph-fill ph-check-circle',
                error: 'ph ph-x-circle',
                running: 'ph-fill ph-play-circle',
            };
            el.className = 'status-item ' + kind;
            el.replaceChildren(icon(icons[kind]), document.createTextNode(' ' + text));
        }

        function updateRunButtons() {
            const runBtn = $('run-btn');
            runBtn.hidden = Py.running;
            runBtn.disabled = !Py.ready;
            $('stop-btn').hidden = !Py.running;
        }

        const Overlay = {
            timer: 0, progress: 0,
            el: () => $('loading-overlay'),

            render() {
                $('progress-bar').style.width = this.progress + '%';
                $('progress-text').textContent = Math.floor(this.progress) + '%';
            },
            show() {
                const bar = $('progress-bar');
                bar.classList.remove('failed');
                $('loading-title').textContent = 'Загрузка Python';
                $('retry-btn').hidden = true;
                this.progress = 0;
                this.render();
                this.el().classList.remove('hidden');
                clearInterval(this.timer);
                this.timer = setInterval(() => {
                    this.progress = Math.min(this.progress + Math.random() * 4 + 1, 92);
                    this.render();
                }, 300);
            },
            done() {
                clearInterval(this.timer);
                if (this.el().classList.contains('hidden')) return;
                this.progress = 100;
                this.render();
                setTimeout(() => this.el().classList.add('hidden'), 250);
            },
            slow() {
                if (this.el().classList.contains('hidden')) return;
                $('progress-text').textContent = 'Загрузка идёт дольше обычного. Проверьте интернет или VPN.';
                $('retry-btn').hidden = false;
            },
            fail(msg) {
                clearInterval(this.timer);
                this.el().classList.remove('hidden');
                $('loading-title').textContent = 'Ошибка загрузки';
                $('progress-text').textContent = msg;
                $('progress-bar').classList.add('failed');
                $('retry-btn').hidden = false;
            },
        };

        function stopWorker() {
            clearTimeout(Py.initTimer);
            if (Py.worker) {
                Py.worker.terminate();
                Py.worker = null;
            }
            if (Py.url) {
                URL.revokeObjectURL(Py.url);
                Py.url = null;
            }
        }

        function startWorker({ overlay = false } = {}) {
            stopWorker();
            Py.ready = false;
            updateRunButtons();
            setStatus('loading', overlay ? 'Загрузка Python...' : 'Перезапуск Python...');
            if (overlay) Overlay.show();

            const src = $('py-worker-src').textContent;
            Py.url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));

            let w;
            try {
                w = new Worker(Py.url);
            } catch (err) {
                onInitFailed('Не удалось создать Web Worker: ' + err.message);
                return;
            }
            Py.worker = w;

            w.onmessage = (e) => { if (w === Py.worker) handleWorkerMessage(e.data); };
            w.onerror = (e) => {
                if (w !== Py.worker) return;
                e.preventDefault();
                onWorkerCrash(e.message || 'неизвестная ошибка');
            };

            Py.initTimer = setTimeout(() => { if (!Py.ready) Overlay.slow(); }, CONFIG.INIT_SLOW_MS);

            w.postMessage({
                type: 'init',
                indexURL: CONFIG.PYODIDE_URL,
                maxOutput: CONFIG.MAX_OUTPUT_CHARS,
            });
        }

        function handleWorkerMessage(m) {
            switch (m.type) {
                case 'ready':
                    clearTimeout(Py.initTimer);
                    Py.ready = true;
                    setStatus('ready', `Python готов · Pyodide ${m.version}`);
                    Overlay.done();
                    updateRunButtons();
                    break;
                case 'init_error':
                    onInitFailed(m.text);
                    break;
                case 'out': {
                    const cls = m.kind === 'stderr' ? 'output-error' : m.kind === 'echo' ? 'output-input' : '';
                    Out.write(m.text, cls);
                    break;
                }
                case 'info':
                    Out.write(m.text + '\n', 'output-info', true);
                    break;
                case 'started':
                    if (Py.running) startRunTimer();
                    break;
                case 'need_input':
                    clearTimeout(Py.runTimer); // Пауза таймаута, пока пользователь думает
                    setTimeout(() => {
                        const val = prompt(m.prompt || 'Введите данные:');
                        if (val === null) {
                            Py.inputs.push("\x00EOF\x00");
                        } else {
                            Py.inputs.push(val);
                        }
                        Out.clear(); // Очищаем консоль перед быстрым перезапуском
                        Py.worker.postMessage({ type: 'run', code: editor.getValue(), inputs: Py.inputs, isReplay: true });
                        startRunTimer(); // Возобновляем таймаут
                    }, 50);
                    break;
                case 'done':
                    onRunFinished(m.code);
                    break;
                case 'run_error':
                    Out.write('\n[Внутренняя ошибка]: ' + m.text + '\n', 'output-error', true);
                    finishRun();
                    startWorker();
                    break;
            }
        }

        function onInitFailed(text) {
            stopWorker();
            Py.ready = false;
            finishRun();
            setStatus('error', 'Ошибка загрузки');
            Overlay.fail('Не удалось загрузить Python. Проверьте интернет или VPN. (' + text + ')');
        }

        function onWorkerCrash(text) {
            if (!Py.ready) { onInitFailed(text); return; }
            Out.write('\n[Критическая ошибка воркера]: ' + text + '\n', 'output-error', true);
            finishRun();
            startWorker();
        }

        // ---- Запуск и остановка ----

        function startRunTimer() {
            clearTimeout(Py.runTimer);
            Py.runTimer = setTimeout(() => {
                Out.write(
                    `\n[ОШИБКА]: Превышено время выполнения (${CONFIG.TIMEOUT_MS / 1000} с).\n` +
                    'Возможно, в коде бесконечный цикл. Измените его и попробуйте снова.\n',
                    'output-error', true
                );
                hardKill('timeout');
            }, CONFIG.TIMEOUT_MS);
        }

        function finishRun() {
            clearTimeout(Py.runTimer);
            Py.running = false;
            if (Py.ready) setStatus('ready', 'Python готов');
            updateRunButtons();
        }

        function onRunFinished(code) {
            const reason = Py.stopReason;
            finishRun();
            if (reason === 'user') {
                Out.write('\n[Выполнение прервано пользователем]\n', 'output-error', true);
            } else if (reason === 'timeout') {
                // сообщение уже выведено
            } else if (code === 0) {
                Out.write('\n[Программа успешно завершена]\n', 'output-success', true);
            } else {
                Out.write(`\n[Программа завершилась с кодом ${code}]\n`, 'output-error', true);
            }
        }

        function hardKill(reason) {
            stopWorker();
            finishRun();
            if (reason === 'user') Out.write('\n[Выполнение прервано пользователем]\n', 'output-error', true);
            Out.write('[Python перезапускается...]\n', 'output-info', true);
            startWorker();
        }

        function runPython() {
            if (Py.running) return;
            if (!Py.ready) {
                Out.write('Python ещё загружается, подождите немного...\n', 'output-info', true);
                return;
            }
            const code = editor.getValue();
            if (!code.trim()) return;

            // Статический анализ на бесконечные циклы
            const problems = detectInfiniteLoops(code);
            if (problems.length) {
                const list = problems.map(p => `  • строка ${p.line}:  ${p.code}`).join('\n');
                const runAnyway = confirm(
                    '⚠️ Обнаружен бесконечный цикл!\n\n' + list + '\n\n' +
                    'В этом цикле нет break / return / raise / exit, поэтому он никогда не завершится.\n\n' +
                    `OK — всё равно запустить (выполнение остановится через ${CONFIG.TIMEOUT_MS / 1000} с),\n` +
                    'Отмена — вернуться к редактированию.'
                );
                if (!runAnyway) {
                    Out.clear();
                    Out.write('⚠️ Запуск отменён: обнаружен бесконечный цикл\n', 'output-error', true);
                    Out.write(`Строки: ${problems.map(p => p.line).join(', ')}\nИзмените код и попробуйте снова.\n`, '', true);
                    editor.setCursor({ line: problems[0].line - 1, ch: 0 });
                    editor.focus();
                    return;
                }
            }

            Out.clear();
            Py.running = true;
            Py.stopReason = null;
            Py.inputs = []; // Сброс истории ввода
            
            setStatus('running', 'Выполняется...');
            updateRunButtons();

            Py.worker.postMessage({ type: 'run', code, inputs: [] });
        }

        // ================= Статический анализ =================

        // Заменяет строки и комментарии заглушками, сохраняя переводы строк
        function stripPython(code) {
            let out = '';
            let i = 0;
            const n = code.length;
            while (i < n) {
                const c = code[i];
                if (c === '#') {
                    while (i < n && code[i] !== '\n') i++;
                    continue;
                }
                if (c === '"' || c === "'") {
                    const triple = code.startsWith(c + c + c, i);
                    const q = triple ? c + c + c : c;
                    out += c + c;
                    i += q.length;
                    while (i < n) {
                        if (code[i] === '\\') {
                            if (code[i + 1] === '\n') out += '\n';
                            i += 2;
                            continue;
                        }
                        if (code.startsWith(q, i)) { i += q.length; break; }
                        if (code[i] === '\n') {
                            out += '\n';
                            i++;
                            if (!triple) break;
                            continue;
                        }
                        i++;
                    }
                    continue;
                }
                out += c;
                i++;
            }
            return out;
        }

        function detectInfiniteLoops(code) {
            const lines = stripPython(code).split('\n');
            const original = code.split('\n');

            // Строки-продолжения (внутри скобок или после "\") не влияют на отступы
            const cont = new Array(lines.length).fill(false);
            let depth = 0;
            let backslash = false;
            for (let i = 0; i < lines.length; i++) {
                cont[i] = depth > 0 || backslash;
                for (const ch of lines[i]) {
                    if (ch === '(' || ch === '[' || ch === '{') depth++;
                    else if (ch === ')' || ch === ']' || ch === '}') depth = Math.max(0, depth - 1);
                }
                backslash = /\\\s*$/.test(lines[i]);
            }

            const WHILE = /^([ \t]*)while\s*\(?\s*(?:True|[1-9]\d*)\s*\)?\s*:(.*)$/;
            const EXIT = /\b(?:break|return|raise|yield)\b|\b(?:exit|quit|_exit)\s*\(/;
            const problems = [];

            for (let i = 0; i < lines.length; i++) {
                if (cont[i]) continue;
                const m = lines[i].match(WHILE);
                if (!m) continue;
                const base = m[1].length;
                let hasExit = EXIT.test(m[2]);
                for (let j = i + 1; j < lines.length && !hasExit; j++) {
                    const l = lines[j];
                    if (!l.trim()) continue;
                    if (!cont[j] && l.match(/^[ \t]*/)[0].length <= base) break;
                    if (EXIT.test(l)) hasExit = true;
                }
                if (!hasExit) problems.push({ line: i + 1, code: (original[i] || '').trim() });
            }
            return problems;
        }

        // ================= Автодополнение =================

        const PY_WORDS = [
            'False', 'None', 'True', 'and', 'as', 'assert', 'async', 'await', 'break', 'class', 'continue',
            'def', 'del', 'elif', 'else', 'except', 'finally', 'for', 'from', 'global', 'if', 'import', 'in',
            'is', 'lambda', 'nonlocal', 'not', 'or', 'pass', 'raise', 'return', 'try', 'while', 'with', 'yield',
            'print', 'input', 'int', 'float', 'str', 'list', 'dict', 'set', 'tuple', 'bool', 'len', 'range', 'type',
            'sum', 'max', 'min', 'abs', 'round', 'open', 'enumerate', 'zip', 'map', 'filter', 'sorted', 'reversed',
            'isinstance', 'lower', 'upper', 'append', 'extend', 'insert', 'remove', 'pop', 'split', 'join',
            'strip', 'replace', 'find', 'count', 'index', 'keys', 'values', 'items', 'format', 'startswith', 'endswith',
        ];

        function smartHint(cm) {
            const cur = cm.getCursor();
            const line = cm.getLine(cur.line);
            let start = cur.ch;
            while (start > 0 && /\w/.test(line[start - 1])) start--;
            const word = line.slice(start, cur.ch);
            if (!word || /^\d/.test(word)) return null;

            const words = new Set(PY_WORDS);
            for (const m of cm.getValue().matchAll(/[A-Za-z_]\w{2,}/g)) words.add(m[0]);
            const list = [...words].filter(w => w.startsWith(word) && w !== word).sort();
            if (!list.length) return null;
            return { list, from: CodeMirror.Pos(cur.line, start), to: CodeMirror.Pos(cur.line, cur.ch) };
        }

        // ================= Прочие действия =================

        function downloadCode() {
            const t = Tabs.getActive();
            const name = (t && t.name) || 'main.py';
            const blob = new Blob([editor.getValue()], { type: 'text/x-python;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = name;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        async function copyOutput() {
            const i = $('copy-btn').querySelector('i');
            try {
                await navigator.clipboard.writeText(Out.text());
                i.className = 'ph ph-check';
            } catch {
                i.className = 'ph ph-x';
            }
            setTimeout(() => { i.className = 'ph ph-copy'; }, 1500);
        }

        function clearOutput() {
            Out.clear();
        }

        function applyTheme(theme) {
            if (!THEMES.includes(theme)) theme = 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            $('theme-select').value = theme;
            store.set(KEYS.theme, theme);
        }

        function applyFontSize(size) {
            const n = Math.min(28, Math.max(10, parseInt(size, 10) || 15));
            $('font-size-slider').value = n;
            $('font-size-val').textContent = n + 'px';
            document.documentElement.style.setProperty('--editor-font-size', n + 'px');
            if (editor) editor.refresh();
            return n;
        }

        function loadFile(file) {
            if (!file) return;
            if (file.size > CONFIG.MAX_FILE_BYTES) {
                Out.write(`Файл слишком большой (максимум ${CONFIG.MAX_FILE_BYTES / 1024} КБ).\n`, 'output-error', true);
                return;
            }
            const reader = new FileReader();
            reader.onload = () => {
                editor.setValue(String(reader.result));
                editor.focus();
            };
            reader.onerror = () => Out.write('Не удалось прочитать файл.\n', 'output-error', true);
            reader.readAsText(file, 'utf-8');
        }

        // ================= Инициализация =================

        function init() {
            Out.el = $('output');

            applyTheme(document.documentElement.getAttribute('data-theme'));

            editor = CodeMirror.fromTextArea($('code-editor'), {
                mode: { name: 'python', version: 3 },
                theme: 'custom',
                lineNumbers: true,
                autoCloseBrackets: true,
                matchBrackets: true,
                indentUnit: 4,
                tabSize: 4,
                indentWithTabs: false,
                lineWrapping: true,
                extraKeys: {
                    'Ctrl-Space': (cm) => cm.showHint({ hint: smartHint, completeSingle: false }),
                    'Ctrl-Enter': () => runPython(),
                    'Cmd-Enter': () => runPython(),
                    'Ctrl-F': 'findPersistent',
                    'Cmd-F': 'findPersistent',
                    'Ctrl-/': 'toggleComment',
                    'Cmd-/': 'toggleComment',
                    'Tab': (cm) => {
                        if (cm.somethingSelected()) cm.execCommand('indentMore');
                        else cm.execCommand('insertSoftTab');
                    },
                    'Shift-Tab': 'indentLess',
                },
            });

            Tabs.init();
            $('tab-add-btn').addEventListener('click', () => Tabs.add());

            editor.on('change', () => {
                if (syncingEditor) return;
                Tabs.setCode(editor.getValue());
            });
            window.addEventListener('pagehide', () => {
                Tabs.saveCursor();
                Tabs.saveNow();
            });
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    Tabs.saveCursor();
                    Tabs.saveNow();
                }
            });

            let typingTimer = 0;
            const ec = $('editor-container');
            editor.on('inputRead', () => {
                ec.classList.add('typing');
                clearTimeout(typingTimer);
                typingTimer = setTimeout(() => ec.classList.remove('typing'), 700);
            });

            let hintTimeout = 0;
            editor.on('inputRead', (cm, change) => {
                if (!/^[A-Za-z_]/.test(change.text[0] || '')) return;
                const type = cm.getTokenTypeAt(cm.getCursor()) || '';
                if (/string|comment/.test(type)) return;
                clearTimeout(hintTimeout);
                hintTimeout = setTimeout(() => cm.showHint({ hint: smartHint, completeSingle: false }), 300);
            });

            editor.on('cursorActivity', (cm) => {
                const pos = cm.getCursor();
                $('cursor-position').textContent = `Стр ${pos.line + 1}, Стлб ${pos.ch + 1}`;
            });

            applyFontSize(store.get(KEYS.font) || 15);
            $('font-size-slider').addEventListener('input', (e) => {
                store.set(KEYS.font, String(applyFontSize(e.target.value)));
            });

            Note.init();

            $('theme-select').addEventListener('change', (e) => applyTheme(e.target.value));
            $('open-btn').addEventListener('click', () => $('file-upload').click());
            $('file-upload').addEventListener('change', (e) => {
                loadFile(e.target.files[0]);
                e.target.value = '';
            });
            $('download-btn').addEventListener('click', downloadCode);
            $('clear-btn').addEventListener('click', clearOutput);
            $('run-btn').addEventListener('click', runPython);
            $('stop-btn').addEventListener('click', () => hardKill('user'));
            $('copy-btn').addEventListener('click', copyOutput);
            $('retry-btn').addEventListener('click', () => startWorker({ overlay: true }));

            document.querySelectorAll('button').forEach(attachRipple);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !editor.hasFocus()) {
                    const tag = e.target.tagName;
                    if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
                        e.preventDefault();
                        runPython();
                    }
                }
            });

            let resizeRaf = 0;
            window.addEventListener('resize', () => {
                cancelAnimationFrame(resizeRaf);
                resizeRaf = requestAnimationFrame(() => editor.refresh());
            });
            setTimeout(() => editor.refresh(), 100);

            startWorker({ overlay: true });
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
        else init();
    })();
    </script>
</body>
</html>
